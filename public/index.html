<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XiaoFan — Mạng xã hội</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f3fb;color:#24213a;font:16px system-ui}header{background:#6750e8;color:white;padding:17px 22px;font-size:23px;font-weight:750;position:sticky;top:0;z-index:2}.panel{background:white;border-radius:16px;padding:16px;box-shadow:0 4px 24px #2221;margin-bottom:14px}.auth{max-width:420px;margin:48px auto}.layout{max-width:1050px;margin:20px auto;padding:0 14px;display:grid;grid-template-columns:250px minmax(0,650px);gap:16px}.hidden{display:none!important}input,textarea,button{font:inherit;padding:10px;border-radius:10px;border:1px solid #ddd;margin:4px 0;width:100%}button{background:#6750e8;color:white;border:0;cursor:pointer;font-weight:600}.secondary{background:#efedfb;color:#332c55}.muted{font-size:13px;color:#777}.tabs{display:flex;gap:8px}.tabs button{flex:1}.storyrow{display:flex;gap:10px;overflow-x:auto}.story{min-width:100px;max-width:110px;text-align:center;cursor:pointer}.story img{width:82px;height:82px;object-fit:cover;border-radius:50%;border:3px solid #8b65ef}.postimg{width:100%;max-height:520px;object-fit:contain;border-radius:12px;background:#eee}.posthead{font-weight:700;margin-bottom:8px}.actions{display:flex;gap:8px}.actions button{width:auto;flex:1}.liked{background:#ffebf1;color:#c2185b}.comments{padding:8px 0}.comment{font-size:14px;padding:4px 0}.composer textarea{width:100%;min-height:70px}.composer input[type=file]{border:0}.chat{height:34vh;overflow:auto;display:flex;flex-direction:column;gap:8px}.msg{padding:10px 13px;border-radius:14px;background:#eeeaf8;max-width:80%;overflow-wrap:anywhere}.mine{background:#6750e8;color:white;align-self:flex-end}.users button{text-align:left;background:#efedfb;color:#332c55}@media(max-width:720px){.layout{grid-template-columns:1fr}.sidebar{order:2}.feed{order:1}}
</style></head><body><header>✦ XiaoFan <small style="font-size:13px;font-weight:400">· chia sẻ khoảnh khắc</small></header>
<section id="auth" class="panel auth"><h2 id="authTitle">Đăng nhập</h2><form id="authForm"><input id="username" placeholder="Tên đăng nhập" required minlength="3"><input id="password" type="password" placeholder="Mật khẩu (ít nhất 8 ký tự)" required minlength="8"><input id="displayName" placeholder="Tên hiển thị khi đăng ký" class="hidden"><button id="authSubmit">Đăng nhập</button></form><button id="toggleAuth" class="secondary">Chưa có tài khoản? Đăng ký</button><p id="authError" class="muted"></p></section>
<main id="app" class="layout hidden"><aside class="sidebar"><section class="panel"><b id="me"></b><button id="showFeed">🏠 Bảng tin</button><button id="showProfile">👤 Trang cá nhân</button><button id="showSettings">⚙ Cài đặt / Ngôn ngữ</button><button id="showChat" class="secondary">Tin nhắn</button><button id="refresh" class="secondary">Làm mới</button><hr><b>Danh bạ</b><div id="users" class="users"></div><button id="logout" class="secondary">Đăng xuất</button></section></aside>
<section class="feed"><section id="storiesPanel" class="panel"><b>Story · biến mất sau 24 giờ</b><div id="stories" class="storyrow"></div><form id="storyForm" class="composer"><input id="storyImage" type="file" accept="image/jpeg,image/png,image/webp,image/gif" required><input id="storyCaption" placeholder="Thêm chú thích cho Story (tuỳ chọn)" maxlength="500"><button>＋ Đăng Story</button></form></section>
<section class="panel composer"><b>Chia sẻ bài viết</b><form id="postForm"><textarea id="caption" placeholder="Bạn đang nghĩ gì? Có thể đăng bài chữ hoặc kèm ảnh..." maxlength="2000"></textarea><label for="postImage">Thêm ảnh (không bắt buộc)</label><input id="postImage" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><button>＋ Đăng bài</button></form><p class="muted">Ảnh được thu nhỏ trên trình duyệt trước khi tải lên.</p></section>
<div id="feed"></div>
<section id="profilePanel" class="panel hidden"><div style="text-align:center"><div id="profileAvatar" style="margin:10px auto;width:88px;height:88px;border-radius:50%;background:#eee0ff;display:grid;place-items:center;font-size:32px">X</div><h2 id="profileName">Trang cá nhân</h2><p id="profileHandle" class="muted"></p><p><b id="profilePostCount">0</b> bài viết · <b id="profileStoryCount">0</b> Story</p></div><h3>Bài viết của tôi</h3><div id="myPosts"></div></section><section id="settingsPanel" class="panel hidden"><h2>Cài đặt</h2><label for="languageSelect">Ngôn ngữ / Language / 语言</label><select id="languageSelect"><option value="vi">Tiếng Việt</option><option value="en">English</option><option value="zh">中文</option></select><p class="muted">Ngôn ngữ được lưu trên thiết bị này.</p><hr><label for="profileDisplayName">Tên hiển thị</label><input id="profileDisplayName" maxlength="100" placeholder="Tên hiển thị"><button id="saveProfile">Lưu thay đổi</button><p id="settingsMessage" class="muted"></p></section><section id="chatPanel" class="panel hidden"><h3 id="chatTitle">Chọn người để nhắn tin</h3><div id="chat" class="chat"></div><form id="sendForm"><input id="message" placeholder="Nhập tin nhắn..." maxlength="5000"><button>Gửi</button></form></section><p id="status" class="muted"></p></section></main>
<div id="storyViewer" class="hidden" style="position:fixed;inset:0;background:#130e25ed;z-index:5;color:white;padding:24px;text-align:center" onclick="if(event.target.id==='storyViewer')this.classList.add('hidden')"><button style="max-width:100px" onclick="document.getElementById('storyViewer').classList.add('hidden')">Đóng ✕</button><h3 id="storyTitle"></h3><img id="storyViewImage" style="max-height:75vh;max-width:95%;border-radius:14px;object-fit:contain"><p id="storyViewCaption"></p></div>
<script src="/socket.io/socket.io.js"></script><script>
const $=id=>document.getElementById(id);let token=localStorage.getItem('xf_token'),me=null,selected=null,register=false,socket=null;
async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Có lỗi xảy ra');return d}
function authView(){ $('auth').classList.remove('hidden');$('app').classList.add('hidden')}
function appView(){ $('auth').classList.add('hidden');$('app').classList.remove('hidden');$('me').textContent='👤 '+me.username}
$('toggleAuth').onclick=()=>{register=!register;$('authTitle').textContent=register?'Tạo tài khoản':'Đăng nhập';$('authSubmit').textContent=register?'Đăng ký':'Đăng nhập';$('displayName').classList.toggle('hidden',!register);$('toggleAuth').textContent=register?'Đã có tài khoản? Đăng nhập':'Chưa có tài khoản? Đăng ký'};
$('authForm').onsubmit=async e=>{e.preventDefault();try{const d=await api('/api/'+(register?'register':'login'),{method:'POST',body:JSON.stringify({username:$('username').value,password:$('password').value,displayName:$('displayName').value})});token=d.token;me=d.user;localStorage.setItem('xf_token',token);await start()}catch(err){$('authError').textContent=err.message}};
async function readImage(file){if(!file)throw Error('Hãy chọn ảnh.');if(!/^image\/(jpeg|png|webp|gif)$/.test(file.type))throw Error('Chỉ hỗ trợ JPG, PNG, WEBP hoặc GIF.');if(file.size>12*1024*1024)throw Error('Ảnh gốc phải nhỏ hơn 12 MB.');if(file.type==='image/gif'&&file.size<4*1024*1024)return await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file)});const img=await new Promise((ok,no)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);ok(i)};i.onerror=no;i.src=u});const scale=Math.min(1,1400/img.width,1400/img.height),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.78)}
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
async function loadStories(){const stories=await api('/api/stories');$('stories').innerHTML='';if(!stories.length)$('stories').append(el('span','muted','Chưa có Story'));stories.forEach(s=>{const b=el('div','story');const im=el('img');im.src=s.image_data;const t=el('div','muted',s.user.displayName);b.append(im,t);b.onclick=()=>{$('storyTitle').textContent=s.user.displayName;$('storyViewImage').src=s.image_data;$('storyViewCaption').textContent=s.caption;$('storyViewer').classList.remove('hidden')};$('stories').append(b)})}
async function loadFeed(){const posts=await api('/api/posts');$('feed').innerHTML='';if(!posts.length)$('feed').append(el('section','panel muted','Chưa có bài viết. Hãy đăng ảnh đầu tiên!'));for(const p of posts){const card=el('article','panel'),head=el('div','posthead',p.user.displayName+' (@'+p.user.username+') · '+new Date(p.created_at).toLocaleString('vi-VN'));card.append(head);if(p.caption)card.append(el('p','',p.caption));if(p.image_data){const im=el('img','postimg');im.src=p.image_data;im.alt='Ảnh bài viết';card.append(im)}const actions=el('div','actions'),like=el('button',p.liked?'liked':'', (p.liked?'♥':'♡')+' Thả tym · '+p.likes),comment=el('button','secondary','💬 Bình luận · '+p.comments);like.onclick=async()=>{try{await api('/api/posts/'+p.id+'/like',{method:'POST',body:'{}'});await loadFeed()}catch(e){status(e.message)}};const comments=el('div','comments');comment.onclick=async()=>{comments.classList.toggle('hidden');if(!comments.dataset.loaded){try{const list=await api('/api/posts/'+p.id+'/comments');list.forEach(c=>comments.append(el('div','comment',c.user.displayName+': '+c.body)));comments.dataset.loaded='1'}catch(e){status(e.message)}}};actions.append(like,comment);card.append(actions,comments);const form=el('form','send');const input=el('input');input.placeholder='Viết bình luận...';input.maxLength=1000;const send=el('button','','Gửi');send.type='submit';form.append(input,send);form.onsubmit=async e=>{e.preventDefault();if(!input.value.trim())return;try{await api('/api/posts/'+p.id+'/comments',{method:'POST',body:JSON.stringify({body:input.value.trim()})});comments.classList.remove('hidden');comments.append(el('div','comment',me.displayName||me.username+': '+input.value.trim()));comments.dataset.loaded='1';input.value='';await loadFeed()}catch(e){status(e.message)}};card.append(form);$('feed').append(card)}}
function status(t){$('status').textContent=t}\nfunction showMain(id){['storiesPanel','feed','profilePanel','settingsPanel','chatPanel'].forEach(k=>{if($(k)){const visible=id==='feed'?(k==='storiesPanel'||k==='feed'):k===id;$(k).classList.toggle('hidden',!visible)}});if($('composer'))$('composer').classList.toggle('hidden',id!=='feed')}\nasync function loadProfile(){const d=await api('/api/profile');me={...me,...d.user};$('profileName').textContent=me.displayName||me.username;$('profileHandle').textContent='@'+me.username;$('profileAvatar').textContent=(me.displayName||me.username).slice(0,1).toUpperCase();$('profilePostCount').textContent=d.posts;$('profileStoryCount').textContent=d.stories;$('profileDisplayName').value=me.displayName||me.username;$('myPosts').innerHTML='';const mine=await api('/api/posts');const own=mine.filter(p=>Number(p.user_id)===Number(me.id));if(!own.length)$('myPosts').textContent='Bạn chưa đăng bài nào.';own.forEach(p=>{const card=document.createElement('article');card.className='panel';const h=document.createElement('b');h.textContent=p.user.displayName+' · '+new Date(p.created_at).toLocaleString('vi-VN');card.append(h);if(p.caption){const c=document.createElement('p');c.textContent=p.caption;card.append(c)}if(p.image_data){const im=document.createElement('img');im.src=p.image_data;im.style='width:100%;max-height:480px;object-fit:contain';card.append(im)}$('myPosts').append(card)})}\n$('showFeed').onclick=()=>showMain('feed');$('showProfile').onclick=()=>{showMain('profilePanel');loadProfile().catch(e=>status(e.message))};$('showSettings').onclick=()=>{showMain('settingsPanel');$('profileDisplayName').value=me?.displayName||me?.username||'';$('languageSelect').value=localStorage.getItem('xf_lang')||'vi'};$('languageSelect').onchange=()=>{localStorage.setItem('xf_lang',$('languageSelect').value);document.documentElement.lang=$('languageSelect').value;const labels={vi:['Bảng tin','Trang cá nhân','Cài đặt / Ngôn ngữ'],en:['Feed','My profile','Settings / Language'],zh:['动态','个人主页','设置 / 语言']};const a=labels[$('languageSelect').value];$('showFeed').textContent='🏠 '+a[0];$('showProfile').textContent='👤 '+a[1];$('showSettings').textContent='⚙ '+a[2]};$('saveProfile').onclick=async()=>{try{const d=await api('/api/profile',{method:'PATCH',body:JSON.stringify({displayName:$('profileDisplayName').value})});me.displayName=d.displayName;$('settingsMessage').textContent='Đã lưu thông tin cá nhân.';await loadProfile()}catch(e){$('settingsMessage').textContent=e.message}};
async function loadUsers(){const users=await api('/api/users');$('users').innerHTML='';users.forEach(u=>{const b=el('button','',u.displayName+' (@'+u.username+')');b.onclick=()=>choose(u);$('users').append(b)})}
async function choose(u){selected=u;showMain('chatPanel');$('chatTitle').textContent='Nhắn tin với '+u.displayName;await loadMessages()}
async function loadMessages(){if(!selected)return;const ms=await api('/api/messages/'+selected.id);$('chat').innerHTML='';ms.forEach(m=>$('chat').append(el('div','msg'+(Number(m.sender_id)===Number(me.id)?' mine':''),m.body)));$('chat').scrollTop=$('chat').scrollHeight}
async function start(){appView();socket?.disconnect();socket=io({auth:{token}});socket.on('message',m=>{if(selected&&(Number(m.sender_id)===Number(selected.id)||Number(m.recipient_id)===Number(selected.id)))loadMessages().catch(()=>{})});await Promise.all([loadStories(),loadFeed(),loadUsers()]);showMain('feed')}
$('postForm').onsubmit=async e=>{e.preventDefault();try{const image=await readImage($('postImage').files[0]);await api('/api/posts',{method:'POST',body:JSON.stringify({caption:$('caption').value,image})});$('caption').value='';$('postImage').value='';await loadFeed();status('Đã đăng ảnh!')}catch(e){status(e.message)}};
$('storyForm').onsubmit=async e=>{e.preventDefault();try{const image=await readImage($('storyImage').files[0]);await api('/api/stories',{method:'POST',body:JSON.stringify({caption:$('storyCaption').value,image})});$('storyCaption').value='';$('storyImage').value='';await loadStories();status('Đã đăng Story. Story sẽ tự hết hạn sau 24 giờ.')}catch(e){status(e.message)}};
$('sendForm').onsubmit=async e=>{e.preventDefault();if(!selected)return;try{await api('/api/messages/'+selected.id,{method:'POST',body:JSON.stringify({body:$('message').value})});$('message').value='';await loadMessages()}catch(e){status(e.message)}};
$('showFeed').onclick=()=>{$('chatPanel').classList.add('hidden');$('feed').classList.remove('hidden')};$('showChat').onclick=()=>{if(selected)choose(selected);else status('Chọn một người trong danh bạ để nhắn tin.')};
$('refresh').onclick=()=>Promise.all([loadStories(),loadFeed(),loadUsers()]).catch(e=>status(e.message));$('logout').onclick=()=>{localStorage.removeItem('xf_token');token=null;socket?.disconnect();authView()};
(async()=>{if(!token)return;try{const p=JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));me={id:p.id,username:p.username,displayName:p.username};await api('/api/health');await start()}catch{localStorage.removeItem('xf_token');token=null;authView()}})();
</script></body></html>

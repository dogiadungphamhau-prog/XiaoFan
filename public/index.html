<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XiaoFan — Nhắn tin</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f3fb;color:#24213a;font:16px system-ui}header{background:#6750e8;color:white;padding:18px 24px;font-size:23px;font-weight:750}.panel{background:white;border-radius:16px;padding:18px;box-shadow:0 4px 24px #2221}.auth{max-width:420px;margin:48px auto}.wrap{max-width:980px;margin:24px auto;padding:0 16px;display:grid;grid-template-columns:270px 1fr;gap:16px}.hidden{display:none!important}input,button{font:inherit;padding:11px;border-radius:10px;border:1px solid #ddd;margin:5px 0;width:100%}button{background:#6750e8;color:white;border:0;cursor:pointer;font-weight:600}.secondary,.users button{background:#efedfb;color:#332c55}.users button{text-align:left}.chat{height:55vh;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:10px 0}.msg{padding:10px 13px;border-radius:14px;background:#eeeaf8;max-width:80%;overflow-wrap:anywhere}.mine{background:#6750e8;color:white;align-self:flex-end}.send{display:flex;gap:8px}.send input{flex:1}.send button{width:90px}.muted{font-size:13px;color:#777}@media(max-width:650px){.wrap{grid-template-columns:1fr}.chat{height:40vh}}
</style></head><body><header>✦ XiaoFan <small style="font-size:13px;font-weight:400">· nhắn tin kết nối</small></header>
<section id="auth" class="panel auth"><h2 id="authTitle">Đăng nhập</h2><form id="authForm"><input id="username" placeholder="Tên đăng nhập" required minlength="3" autocomplete="username"><input id="password" type="password" placeholder="Mật khẩu (tối thiểu 8 ký tự)" required minlength="8" autocomplete="current-password"><input id="displayName" placeholder="Tên hiển thị khi đăng ký" class="hidden"><button id="authSubmit">Đăng nhập</button></form><button id="toggleAuth" class="secondary">Chưa có tài khoản? Đăng ký</button><p id="authError" class="muted"></p></section>
<main id="app" class="wrap hidden"><aside class="panel"><b>Danh bạ</b><button id="refresh" class="secondary">Làm mới</button><div id="users" class="users"></div><hr><p id="me" class="muted"></p><button id="logout" class="secondary">Đăng xuất</button></aside><section class="panel"><h3 id="chatTitle">Chọn người để nhắn tin</h3><div id="chat" class="chat"></div><form id="sendForm" class="send"><input id="message" placeholder="Nhập tin nhắn..." maxlength="5000" autocomplete="off"><button>Gửi</button></form><p id="status" class="muted"></p></section></main>
<script src="/socket.io/socket.io.js"></script><script>
const $=id=>document.getElementById(id);let token=localStorage.getItem('xf_token'),me=null,selected=null,register=false,socket=null;
async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Có lỗi xảy ra');return d}
function authView(){ $('auth').classList.remove('hidden');$('app').classList.add('hidden')}
function appView(){ $('auth').classList.add('hidden');$('app').classList.remove('hidden');$('me').textContent='Đăng nhập: '+me.username}
$('toggleAuth').onclick=()=>{register=!register;$('authTitle').textContent=register?'Tạo tài khoản':'Đăng nhập';$('authSubmit').textContent=register?'Đăng ký':'Đăng nhập';$('displayName').classList.toggle('hidden',!register);$('toggleAuth').textContent=register?'Đã có tài khoản? Đăng nhập':'Chưa có tài khoản? Đăng ký';$('authError').textContent=''};
$('authForm').onsubmit=async e=>{e.preventDefault();try{$('authError').textContent='Đang xử lý...';const d=await api('/api/'+(register?'register':'login'),{method:'POST',body:JSON.stringify({username:$('username').value,password:$('password').value,displayName:$('displayName').value})});token=d.token;me=d.user;localStorage.setItem('xf_token',token);await start()}catch(err){$('authError').textContent=err.message}};
function drawUsers(users){$('users').innerHTML='';users.forEach(u=>{const b=document.createElement('button');b.textContent=u.displayName+' (@'+u.username+')';b.onclick=()=>choose(u);$('users').append(b)})}
async function loadUsers(){drawUsers(await api('/api/users'))}
async function choose(u){selected=u;$('chatTitle').textContent=u.displayName+' (@'+u.username+')';await loadMessages()}
async function loadMessages(){if(!selected)return;try{const ms=await api('/api/messages/'+selected.id);$('chat').innerHTML='';ms.forEach(m=>{const d=document.createElement('div');d.className='msg'+(Number(m.sender_id)===Number(me.id)?' mine':'');d.textContent=m.body;$('chat').append(d)});$('chat').scrollTop=$('chat').scrollHeight}catch(e){$('status').textContent=e.message}}
async function start(){appView();socket?.disconnect();socket=io({auth:{token}});socket.on('message',m=>{if(selected&&(Number(m.sender_id)===Number(selected.id)||Number(m.recipient_id)===Number(selected.id)))loadMessages()});await loadUsers()}
$('refresh').onclick=()=>loadUsers().catch(e=>$('status').textContent=e.message);
$('sendForm').onsubmit=async e=>{e.preventDefault();const body=$('message').value.trim();if(!body||!selected)return;try{await api('/api/messages/'+selected.id,{method:'POST',body:JSON.stringify({body})});$('message').value='';await loadMessages()}catch(err){$('status').textContent=err.message}};
$('logout').onclick=()=>{localStorage.removeItem('xf_token');token=null;me=null;selected=null;socket?.disconnect();authView()};
(async()=>{if(!token)return;try{const p=JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));me={id:p.id,username:p.username,displayName:p.username};await api('/api/health');await start()}catch{localStorage.removeItem('xf_token');token=null;authView()}})();
</script></body></html>

<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XiaoFan — Mạng xã hội</title><style>
*{box-sizing:border-box} :root{--green-950:#123b25;--green-900:#1b5e20;--green-700:#2e7d32;--green-600:#388e3c;--green-100:#e8f5e9;--green-50:#f4fbf5;--ink:#183126;--muted:#617268;--line:#dce9df;--shadow:0 10px 32px rgba(18,59,37,.08)} body{margin:0;background:linear-gradient(180deg,#edf7ef 0,#f7fbf7 360px,#f5f8f5 100%);color:var(--ink);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:linear-gradient(120deg,var(--green-950),var(--green-700));color:white;padding:16px clamp(16px,4vw,36px);font-size:24px;font-weight:800;letter-spacing:-.5px;position:sticky;top:0;z-index:10;box-shadow:0 5px 22px #123b2526}header:after{content:"";display:block;position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#a5d6a7,#e8f5e9,#66bb6a)}.panel{background:rgba(255,255,255,.96);border:1px solid #e3eee5;border-radius:20px;padding:clamp(15px,2.5vw,22px);box-shadow:var(--shadow);margin-bottom:16px;transition:box-shadow .2s,border-color .2s}.panel:hover{border-color:#c6e2ca}.auth{max-width:440px;margin:clamp(24px,8vh,70px) auto}.layout{width:100%;max-width:none;min-height:calc(100vh - 76px);margin:0;padding:22px clamp(12px,2vw,32px);display:grid;grid-template-columns:clamp(240px,19vw,320px) minmax(0,1fr);gap:clamp(14px,1.8vw,28px);align-items:start}.feed{min-width:0;width:100%;max-width:none}.feed>.panel,#feed>article{width:100%}#chatPanel{min-height:calc(100vh - 150px)}.chat{height:calc(100vh - 330px);min-height:360px;max-height:calc(100vh - 250px)}.sidebar{position:sticky;top:88px;max-height:calc(100vh - 104px);overflow:auto;scrollbar-width:thin}.sidebar .panel{padding:14px}.hidden{display:none!important}input,textarea,select,button{box-sizing:border-box;font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--line);margin:5px 0;width:100%;min-height:44px;transition:border-color .18s,box-shadow .18s,transform .18s}input,textarea,select{background:#fbfdfb;color:var(--ink)}input:focus,textarea:focus,select:focus{outline:none;border-color:var(--green-600);box-shadow:0 0 0 3px #4caf5024}button{background:var(--green-700);color:white;border:1px solid transparent;cursor:pointer;font-weight:700;box-shadow:0 3px 8px #2e7d321a}button:hover{background:var(--green-900);transform:translateY(-1px)}button:focus-visible{outline:3px solid #81c784;outline-offset:2px}.secondary{background:var(--green-100);color:var(--green-950);box-shadow:none;border-color:#d2e8d5}.secondary:hover{background:#d5ecd8;color:var(--green-950)}.muted{font-size:13px;color:var(--muted)}.tabs{display:flex;gap:8px}.tabs button{flex:1}.storyrow{display:flex;gap:14px;overflow-x:auto;padding:8px 2px 12px}.story{min-width:100px;max-width:110px;text-align:center;cursor:pointer;padding:6px;border-radius:14px}.story:hover{background:var(--green-50)}.story img{width:82px;height:82px;object-fit:cover;border-radius:50%;border:3px solid #66bb6a;padding:2px}.postimg{width:100%;max-height:560px;object-fit:contain;border-radius:14px;background:#f1f7f2}.posthead{font-weight:750;margin-bottom:8px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{width:auto;flex:1;min-width:120px}.liked{background:#ffebee;color:#b71c1c}.comments{padding:8px 0}.comment{font-size:14px;padding:7px 10px;margin:4px 0;background:#f4faf5;border-radius:10px}.composer textarea{width:100%;min-height:100px;resize:vertical}.composer input[type=file]{border:0;background:#f5faf5}.chat{height:34vh;min-height:220px;overflow:auto;display:flex;flex-direction:column;gap:8px}.msg{padding:10px 13px;border-radius:14px;background:#edf6ee;max-width:82%;overflow-wrap:anywhere}.mine{background:var(--green-700);color:white;align-self:flex-end}.users button{text-align:left;background:#f2f8f3;color:var(--green-950);box-shadow:none;border-color:#e0eee2}.users button:hover{background:#dff0e2}.sidebar hr{border:0;border-top:1px solid var(--line);margin:14px 0}.sidebar #me{display:block;padding:8px 10px 12px;font-size:16px}.sidebar button{min-height:46px;text-align:left}.expand-details{margin:4px 0 10px 12px;padding:10px 12px;background:#f2faf3;border:1px solid #d6ead9;border-radius:12px;color:var(--green-950);font-size:13px;animation:reveal .18s ease-out}.expand-details button{background:white;color:var(--green-900);box-shadow:none;border-color:#d6ead9;font-size:13px}.expand-details button:hover{background:var(--green-100)}@keyframes reveal{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}#profileAvatar{background:linear-gradient(145deg,#c8e6c9,#e8f5e9)!important;color:var(--green-900);border:3px solid white;box-shadow:0 0 0 2px #a5d6a7}#settingsPanel label,#postForm label{display:block;font-weight:650;margin-top:10px}#status{padding:0 4px;font-weight:600}#feed article{overflow:hidden}#storyViewer button{background:#2e7d32}@media(max-width:820px){.layout{grid-template-columns:1fr;gap:12px;margin:0 auto;padding:12px}.sidebar{position:static;order:0}.sidebar .panel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.sidebar #me,.sidebar hr,.sidebar .users,.sidebar b:not(#me){grid-column:1/-1}.sidebar button{margin:0}.feed{order:1}.panel{border-radius:16px}}@media(max-width:480px){header{font-size:21px;padding:14px 16px}.layout{padding:0 9px}.panel{padding:14px}.sidebar .panel{grid-template-columns:1fr 1fr}.actions button{min-width:0;font-size:13px;padding:10px 8px}.story img{width:70px;height:70px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><header>✦ XiaoFan <small style="font-size:13px;font-weight:400">· chia sẻ khoảnh khắc</small></header>
<section id="auth" class="panel auth"><h2 id="authTitle">Đăng nhập</h2><form id="authForm"><input id="username" placeholder="Tên đăng nhập" required minlength="3"><input id="password" type="password" placeholder="Mật khẩu (ít nhất 8 ký tự)" required minlength="8"><input id="displayName" placeholder="Tên hiển thị khi đăng ký" class="hidden"><button id="authSubmit">Đăng nhập</button></form><button id="toggleAuth" class="secondary">Chưa có tài khoản? Đăng ký</button><p id="authError" class="muted"></p></section>
<main id="app" class="layout hidden"><aside class="sidebar"><section class="panel"><b id="me"></b><button id="showFeed">🏠 Bảng tin</button><button id="showProfile">👤 Trang cá nhân</button><button id="showSettings">⚙ Cài đặt / Ngôn ngữ</button><button id="showChat" class="secondary">Tin nhắn</button><button id="refresh" class="secondary">Làm mới</button><hr><b>Danh bạ</b><div id="users" class="users"></div><hr><b>Nhóm chat</b><div id="groups" class="users"></div><form id="createGroupForm"><input id="groupName" placeholder="Tên nhóm mới" maxlength="100" required minlength="2"><label for="groupMembers" class="muted">Chọn thành viên (giữ Ctrl để chọn nhiều)</label><select id="groupMembers" multiple size="4" aria-label="Thành viên nhóm"></select><button type="submit">＋ Tạo nhóm chat</button></form><button id="logout" class="secondary">Đăng xuất</button></section></aside>
<section class="feed"><section id="storiesPanel" class="panel"><b>Story · biến mất sau 24 giờ</b><div id="stories" class="storyrow"></div><form id="storyForm" class="composer"><input id="storyImage" type="file" accept="image/jpeg,image/png,image/webp,image/gif" required><input id="storyCaption" placeholder="Thêm chú thích cho Story (tuỳ chọn)" maxlength="500"><button>＋ Đăng Story</button></form></section>
<section class="panel composer"><b>Chia sẻ bài viết</b><form id="postForm"><textarea id="caption" placeholder="Bạn đang nghĩ gì? Có thể đăng bài chữ hoặc kèm ảnh..." maxlength="2000"></textarea><label for="postImage">Thêm ảnh (không bắt buộc)</label><input id="postImage" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><button>＋ Đăng bài</button></form><p class="muted">Ảnh được thu nhỏ trên trình duyệt trước khi tải lên.</p></section>
<div id="feed"></div>
<section id="profilePanel" class="panel hidden"><div style="text-align:center"><div id="profileAvatar" style="margin:10px auto;width:88px;height:88px;border-radius:50%;background:#eee0ff;display:grid;place-items:center;font-size:32px">X</div><h2 id="profileName">Trang cá nhân</h2><p id="profileHandle" class="muted"></p><p><b id="profilePostCount">0</b> bài viết · <b id="profileStoryCount">0</b> Story</p></div><h3>Bài viết của tôi</h3><div id="myPosts"></div></section><section id="settingsPanel" class="panel hidden"><h2>Cài đặt</h2><label for="languageSelect">Ngôn ngữ / Language / 语言</label><select id="languageSelect"><option value="vi">Tiếng Việt</option><option value="en">English</option><option value="zh">中文</option></select><p class="muted">Ngôn ngữ được lưu trên thiết bị này.</p><hr><label for="profileDisplayName">Tên hiển thị</label><input id="profileDisplayName" maxlength="100" placeholder="Tên hiển thị"><button id="saveProfile">Lưu thay đổi</button><p id="settingsMessage" class="muted"></p></section><section id="chatPanel" class="panel hidden"><h3 id="chatTitle">Chọn người để nhắn tin</h3><div id="chat" class="chat"></div><form id="sendForm"><input id="message" placeholder="Nhập tin nhắn..." maxlength="5000"><button>Gửi</button></form></section><p id="status" class="muted"></p></section></main>
<div id="storyViewer" class="hidden" style="position:fixed;inset:0;background:#130e25ed;z-index:5;color:white;padding:24px;text-align:center" onclick="if(event.target.id==='storyViewer')this.classList.add('hidden')"><button style="max-width:100px" onclick="document.getElementById('storyViewer').classList.add('hidden')">Đóng ✕</button><h3 id="storyTitle"></h3><img id="storyViewImage" style="max-height:75vh;max-width:95%;border-radius:14px;object-fit:contain"><p id="storyViewCaption"></p></div>
<script src="/socket.io/socket.io.js"></script><script>
const $=id=>document.getElementById(id);let token=localStorage.getItem('xf_token'),me=null,selected=null,register=false,socket=null;
async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Có lỗi xảy ra');return d}
function authView(){ $('auth').classList.remove('hidden');$('app').classList.add('hidden')}
function appView(){ $('auth').classList.add('hidden');$('app').classList.remove('hidden');$('me').textContent='👤 '+me.username}
$('toggleAuth').onclick=()=>{register=!register;$('authTitle').textContent=register?'Tạo tài khoản':'Đăng nhập';$('authSubmit').textContent=register?'Đăng ký':'Đăng nhập';$('displayName').classList.toggle('hidden',!register);$('toggleAuth').textContent=register?'Đã có tài khoản? Đăng nhập':'Chưa có tài khoản? Đăng ký'};
$('authForm').onsubmit=async e=>{e.preventDefault();try{const d=await api('/api/'+(register?'register':'login'),{method:'POST',body:JSON.stringify({username:$('username').value,password:$('password').value,displayName:$('displayName').value})});token=d.token;me=d.user;localStorage.setItem('xf_token',token);await start()}catch(err){$('authError').textContent=err.message}};
async function readImage(file){if(!file)throw Error('Hãy chọn ảnh.');if(!/^image\/(jpeg|png|webp|gif)$/.test(file.type))throw Error('Chỉ hỗ trợ JPG, PNG, WEBP hoặc GIF.');if(file.size>12*1024*1024)throw Error('Ảnh gốc phải nhỏ hơn 12 MB.');if(file.type==='image/gif'&&file.size<4*1024*1024)return await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file)});const img=await new Promise((ok,no)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);ok(i)};i.onerror=no;i.src=u});const scale=Math.min(1,1400/img.width,1400/img.height),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.78)}
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
async function loadStories(){const stories=await api('/api/stories');$('stories').innerHTML='';if(!stories.length)$('stories').append(el('span','muted','Chưa có Story'));stories.forEach(s=>{const b=el('div','story');const im=el('img');im.src=s.image_data;const t=el('div','muted',s.user.displayName);b.append(im,t);b.onclick=()=>{$('storyTitle').textContent=s.user.displayName;$('storyViewImage').src=s.image_data;$('storyViewCaption').textContent=s.caption;$('storyViewer').classList.remove('hidden')};$('stories').append(b)})}
async function loadFeed(){const posts=await api('/api/posts');$('feed').innerHTML='';if(!posts.length)$('feed').append(el('section','panel muted','Chưa có bài viết. Hãy đăng ảnh đầu tiên!'));for(const p of posts){const card=el('article','panel'),head=el('div','posthead',p.user.displayName+' (@'+p.user.username+') · '+new Date(p.created_at).toLocaleString('vi-VN'));card.append(head);if(p.caption)card.append(el('p','',p.caption));if(p.image_data){const im=el('img','postimg');im.src=p.image_data;im.alt='Ảnh bài viết';card.append(im)}const actions=el('div','actions'),like=el('button',p.liked?'liked':'', (p.liked?'♥':'♡')+' Thả tym · '+p.likes),comment=el('button','secondary','💬 Bình luận · '+p.comments);like.onclick=async()=>{try{await api('/api/posts/'+p.id+'/like',{method:'POST',body:'{}'});await loadFeed()}catch(e){status(e.message)}};const comments=el('div','comments');comment.onclick=async()=>{comments.classList.toggle('hidden');if(!comments.dataset.loaded){try{const list=await api('/api/posts/'+p.id+'/comments');list.forEach(c=>comments.append(el('div','comment',c.user.displayName+': '+c.body)));comments.dataset.loaded='1'}catch(e){status(e.message)}}};actions.append(like,comment);card.append(actions,comments);const form=el('form','send');const input=el('input');input.placeholder='Viết bình luận...';input.maxLength=1000;const send=el('button','','Gửi');send.type='submit';form.append(input,send);form.onsubmit=async e=>{e.preventDefault();if(!input.value.trim())return;try{await api('/api/posts/'+p.id+'/comments',{method:'POST',body:JSON.stringify({body:input.value.trim()})});comments.classList.remove('hidden');comments.append(el('div','comment',me.displayName||me.username+': '+input.value.trim()));comments.dataset.loaded='1';input.value='';await loadFeed()}catch(e){status(e.message)}};card.append(form);$('feed').append(card)}}
function status(t){$('status').textContent=t}
function showMain(id){['storiesPanel','feed','profilePanel','settingsPanel','chatPanel'].forEach(k=>{if($(k)){const visible=id==='feed'?(k==='storiesPanel'||k==='feed'):k===id;$(k).classList.toggle('hidden',!visible)}});if($('composer'))$('composer').classList.toggle('hidden',id!=='feed')}
async function loadProfile(){const d=await api('/api/profile');me={...me,...d.user};$('profileName').textContent=me.displayName||me.username;$('profileHandle').textContent='@'+me.username;$('profileAvatar').textContent=(me.displayName||me.username).slice(0,1).toUpperCase();$('profilePostCount').textContent=d.posts;$('profileStoryCount').textContent=d.stories;$('profileDisplayName').value=me.displayName||me.username;$('myPosts').innerHTML='';const mine=await api('/api/posts');const own=mine.filter(p=>Number(p.user_id)===Number(me.id));if(!own.length)$('myPosts').textContent='Bạn chưa đăng bài nào.';own.forEach(p=>{const card=document.createElement('article');card.className='panel';const h=document.createElement('b');h.textContent=p.user.displayName+' · '+new Date(p.created_at).toLocaleString('vi-VN');card.append(h);if(p.caption){const c=document.createElement('p');c.textContent=p.caption;card.append(c)}if(p.image_data){const im=document.createElement('img');im.src=p.image_data;im.style='width:100%;max-height:480px;object-fit:contain';card.append(im)}$('myPosts').append(card)})}
$('showFeed').onclick=()=>showMain('feed');$('showProfile').onclick=()=>{showMain('profilePanel');loadProfile().catch(e=>status(e.message))};$('showSettings').onclick=()=>{showMain('settingsPanel');$('profileDisplayName').value=me?.displayName||me?.username||'';$('languageSelect').value=localStorage.getItem('xf_lang')||'vi'};$('languageSelect').onchange=()=>{localStorage.setItem('xf_lang',$('languageSelect').value);document.documentElement.lang=$('languageSelect').value;const labels={vi:['Bảng tin','Trang cá nhân','Cài đặt / Ngôn ngữ'],en:['Feed','My profile','Settings / Language'],zh:['动态','个人主页','设置 / 语言']};const a=labels[$('languageSelect').value];$('showFeed').textContent='🏠 '+a[0];$('showProfile').textContent='👤 '+a[1];$('showSettings').textContent='⚙ '+a[2]};$('saveProfile').onclick=async()=>{try{const d=await api('/api/profile',{method:'PATCH',body:JSON.stringify({displayName:$('profileDisplayName').value})});me.displayName=d.displayName;$('settingsMessage').textContent='Đã lưu thông tin cá nhân.';await loadProfile()}catch(e){$('settingsMessage').textContent=e.message}};
async function loadUsers(){const users=await api('/api/users');$('users').innerHTML='';$('groupMembers').innerHTML='';users.forEach(u=>{const b=el('button','',u.displayName+' (@'+u.username+')');b.onclick=()=>choose(u);$('users').append(b);const o=document.createElement('option');o.value=u.id;o.textContent=u.displayName+' (@'+u.username+')';$('groupMembers').append(o)})}
async function loadGroups(){const groups=await api('/api/groups');$('groups').innerHTML='';if(!groups.length)$('groups').append(el('p','muted','Chưa có nhóm chat.'));groups.forEach(g=>{const b=el('button','', '👥 '+g.name+' · '+g.member_count);b.onclick=()=>choose(g);$('groups').append(b)})}
async async function choose(u){selected=u;showMain('chatPanel');$('chatTitle').textContent=u.type==='group'?'👥 '+u.name+' · '+u.member_count+' thành viên':'Nhắn tin với '+u.displayName;await loadMessages()}
async function loadMessages(){if(!selected)return;const group=selected.type==='group',ms=await api(group?'/api/groups/'+selected.id+'/messages':'/api/messages/'+selected.id);$('chat').innerHTML='';ms.forEach(m=>$('chat').append(el('div','msg'+(Number(m.sender_id)===Number(me.id)?' mine':''),(group?(m.user?.displayName||m.user?.username||'Thành viên')+': ':'')+m.body)));$('chat').scrollTop=$('chat').scrollHeight}
async function start(){appView();socket?.disconnect();socket=io({auth:{token}});socket.on('message',m=>{if(selected&&selected.type!=='group'&&(Number(m.sender_id)===Number(selected.id)||Number(m.recipient_id)===Number(selected.id)))loadMessages().catch(()=>{})});socket.on('group-message',m=>{if(selected?.type==='group'&&Number(selected.id)===Number(m.group_id))loadMessages().catch(()=>{})});await Promise.all([loadStories(),loadFeed(),loadUsers(),loadGroups()]);showMain('feed')}

function applyLanguage(lang=localStorage.getItem('xf_lang')||'vi'){
 const t=translations[lang]||translations.vi;localStorage.setItem('xf_lang',lang);document.documentElement.lang=lang;
 const set=(id,key)=>{if($(id))$(id).textContent=t[key]};
 set('showFeed','feed');set('showProfile','profile');set('showSettings','settings');set('showChat','chat');set('refresh','refresh');set('logout','logout');
 const text=(selector,key)=>{const n=document.querySelector(selector);if(n)n.textContent=t[key]};
 text('#storiesPanel > b','stories');text('.composer > b','postTitle');text('#settingsPanel h2','settingsTitle');text('#profilePanel h3','profilePosts');
 text('label[for="languageSelect"]','languageLabel');text('#settingsPanel .muted','languageHint');text('label[for="postImage"]','imageLabel');
 if($('caption'))$('caption').placeholder=t.caption;if($('storyCaption'))$('storyCaption').placeholder=t.storyCaption;if($('message'))$('message').placeholder=t.message;
 if($('username'))$('username').placeholder=t.username;if($('password'))$('password').placeholder=t.password;if($('profileDisplayName'))$('profileDisplayName').placeholder=t.displayName;
 if($('saveProfile'))$('saveProfile').textContent=t.save;if($('sendForm')?.querySelector('button'))$('sendForm').querySelector('button').textContent=t.send;
 const pf=$('postForm')?.querySelector('button');if(pf)pf.textContent=t.postButton;const sf=$('storyForm')?.querySelector('button');if(sf)sf.textContent=t.storyButton;
 if($('authTitle')&&!register)$('authTitle').textContent=t.login;if($('authSubmit')&&!register)$('authSubmit').textContent=t.login;
 if($('toggleAuth')&&!register)$('toggleAuth').textContent=t.register;
 document.querySelectorAll('.expand-details').forEach(n=>{const key=n.dataset.translationKey;if(key&&t[key])n.textContent=t[key]});
}
$('languageSelect').onchange=()=>applyLanguage($('languageSelect').value);
$('showFeed').addEventListener('dblclick',()=>{});
document.addEventListener('dblclick',e=>{
 const item=e.target.closest('.sidebar button,.sidebar #me,.sidebar b,.panel h2,.panel h3,.posthead');
 if(!item||item.closest('.expand-details'))return;
 const key=item.id==='showFeed'?'feedDetails':item.id==='showProfile'?'profileDetails':item.id==='showSettings'?'settingsDetails':item.id==='showChat'?'chatDetails':item.id==='refresh'?'refreshDetails':item.id==='logout'?'logoutDetails':null;
 if(!key)return;
 const next=item.nextElementSibling;
 if(next?.classList.contains('expand-details')){next.remove();item.setAttribute('aria-expanded','false');return}
 document.querySelectorAll('.expand-details').forEach(n=>n.remove());
 const box=document.createElement('div');box.className='expand-details';box.dataset.translationKey=key;box.textContent=(translations[localStorage.getItem('xf_lang')||'vi']||translations.vi)[key];box.setAttribute('role','region');item.insertAdjacentElement('afterend',box);item.setAttribute('aria-expanded','true');
});
$('languageSelect').value=localStorage.getItem('xf_lang')||'vi';
applyLanguage($('languageSelect').value);

$('postForm').onsubmit=async e=>{e.preventDefault();try{const caption=$('caption').value.trim();const file=$('postImage').files[0];if(!caption&&!file)throw Error('Hãy nhập nội dung hoặc chọn ảnh.');const image=file?await readImage(file):null;await api('/api/posts',{method:'POST',body:JSON.stringify({caption,image})});$('caption').value='';$('postImage').value='';await loadFeed();status('Đã đăng bài!')}catch(e){status(e.message)}};
$('storyForm').onsubmit=async e=>{e.preventDefault();try{const image=await readImage($('storyImage').files[0]);await api('/api/stories',{method:'POST',body:JSON.stringify({caption:$('storyCaption').value,image})});$('storyCaption').value='';$('storyImage').value='';await loadStories();status('Đã đăng Story. Story sẽ tự hết hạn sau 24 giờ.')}catch(e){status(e.message)}};
$('sendForm').onsubmit=async e=>{e.preventDefault();if(!selected)return;try{const body=$('message').value.trim();if(!body)return;await api(selected.type==='group'?'/api/groups/'+selected.id+'/messages':'/api/messages/'+selected.id,{method:'POST',body:JSON.stringify({body})});$('message').value='';await loadMessages()}catch(e){status(e.message)}};
$('createGroupForm').onsubmit=async e=>{e.preventDefault();try{const name=$('groupName').value.trim(),memberIds=[...$('groupMembers').selectedOptions].map(o=>Number(o.value));const g=await api('/api/groups',{method:'POST',body:JSON.stringify({name,memberIds})});$('groupName').value='';[...$('groupMembers').options].forEach(o=>o.selected=false);await loadGroups();await choose({...g,type:'group',member_count:g.memberCount});status('Đã tạo nhóm chat '+g.name)}catch(err){status(err.message)}};
$('showFeed').onclick=()=>showMain('feed');$('showChat').onclick=()=>{if(selected)choose(selected);else status('Chọn một người trong danh bạ để nhắn tin.')};
$('refresh').onclick=()=>Promise.all([loadStories(),loadFeed(),loadUsers(),loadGroups()]).catch(e=>status(e.message));$('logout').onclick=()=>{localStorage.removeItem('xf_token');token=null;socket?.disconnect();authView()};
(async()=>{if(!token)return;try{const p=JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));me={id:p.id,username:p.username,displayName:p.username};await api('/api/health');await start()}catch{localStorage.removeItem('xf_token');token=null;authView()}})();
</script></body></html>
